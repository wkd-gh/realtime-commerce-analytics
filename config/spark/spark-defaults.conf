# Spark Defaults Configuration for Streaming

# Application
spark.app.name=commerce-analytics-streaming

# Master
spark.master=spark://spark-master:7077

# Executor Settings
spark.executor.memory=2g
spark.executor.cores=2
spark.executor.instances=2

# Driver Settings
spark.driver.memory=2g
spark.driver.cores=2

# Serialization
spark.serializer=org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer.max=512m

# Shuffle
spark.sql.shuffle.partitions=12
spark.default.parallelism=12

# Streaming
spark.streaming.stopGracefullyOnShutdown=true
spark.streaming.backpressure.enabled=true
spark.streaming.kafka.maxRatePerPartition=1000

# Structured Streaming
spark.sql.streaming.checkpointLocation=/opt/spark/checkpoints
spark.sql.streaming.metricsEnabled=true
spark.sql.streaming.stateStore.stateSchemaCheck=false

# Memory Management
spark.memory.fraction=0.8
spark.memory.storageFraction=0.3

# Kafka Integration
spark.jars.packages=org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0

# Compression
spark.io.compression.codec=snappy

# UI
spark.ui.enabled=true
spark.ui.port=4040

# Logging
spark.eventLog.enabled=true
spark.eventLog.dir=/opt/spark/logs

# Speculation
spark.speculation=false

# Dynamic Allocation (disabled for streaming)
spark.dynamicAllocation.enabled=false

# Adaptive Query Execution
spark.sql.adaptive.enabled=true
spark.sql.adaptive.coalescePartitions.enabled=true
