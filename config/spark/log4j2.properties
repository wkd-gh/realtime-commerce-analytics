# Log4j2 Configuration for Spark

# Root Logger
rootLogger.level=WARN
rootLogger.appenderRef.console.ref=console

# Console Appender
appender.console.type=Console
appender.console.name=console
appender.console.target=SYSTEM_ERR
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# Spark Logger
logger.spark.name=org.apache.spark
logger.spark.level=WARN

# Kafka Logger
logger.kafka.name=org.apache.kafka
logger.kafka.level=WARN

# Streaming Logger
logger.streaming.name=org.apache.spark.streaming
logger.streaming.level=INFO

# Application Logger
logger.app.name=streaming
logger.app.level=INFO

# SQL Logger
logger.sql.name=org.apache.spark.sql
logger.sql.level=WARN

# Structured Streaming Logger
logger.structured.name=org.apache.spark.sql.streaming
logger.structured.level=INFO

# Executor Logger
logger.executor.name=org.apache.spark.executor
logger.executor.level=WARN

# Shuffle Logger
logger.shuffle.name=org.apache.spark.shuffle
logger.shuffle.level=WARN

# Network Logger
logger.network.name=org.apache.spark.network
logger.network.level=WARN

# Storage Logger
logger.storage.name=org.apache.spark.storage
logger.storage.level=WARN
