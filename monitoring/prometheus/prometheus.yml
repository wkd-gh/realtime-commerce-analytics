global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Kafka metrics via JMX Exporter
  - job_name: 'kafka'
    static_configs:
      - targets:
          - 'kafka-1:9999'
          - 'kafka-2:9999'
          - 'kafka-3:9999'
    metrics_path: /metrics

  # Spark metrics
  - job_name: 'spark'
    static_configs:
      - targets:
          - 'spark-master:4040'
          - 'spark-worker-1:4041'
          - 'spark-worker-2:4042'
    metrics_path: /metrics/prometheus

  # PostgreSQL metrics via postgres_exporter
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres:9187']

  # ClickHouse metrics
  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:9363']
    metrics_path: /metrics

  # Redis metrics via redis_exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121']

  # Elasticsearch metrics
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch:9114']

  # Application metrics (Producers)
  - job_name: 'producers'
    static_configs:
      - targets:
          - 'host.docker.internal:8000'
    metrics_path: /metrics

  # Node Exporter for system metrics
  - job_name: 'node'
    static_configs:
      - targets: ['host.docker.internal:9100']
